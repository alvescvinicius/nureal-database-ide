name: Release

# Dispara ao publicar uma tag no formato vX.Y.Z (ex.: v0.1.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessario para criar o Release e anexar arquivos

env:
  # Versao do Ollama embutida no instalador (baixada dos Releases oficiais do
  # projeto Ollama e empacotada dentro do app-image — ver o step "Baixar o
  # Ollama embutido" de cada job abaixo). Fixada (nao "latest") pelo mesmo
  # motivo de todo o resto do projeto usar versoes travadas: reprodutibilidade
  # do build.
  #
  # ATENCAO: verifique em https://github.com/ollama/ollama/releases se esta
  # tag e os nomes de asset usados abaixo (ollama-windows-amd64.zip,
  # ollama-darwin.tgz, ollama-linux-amd64.tgz) ainda existem/tem esse formato
  # ANTES de confiar num run real deste workflow — o projeto Ollama pode
  # renomear/reestruturar os assets entre versoes, e isto so e confirmavel
  # com uma execucao de verdade do Actions (nao simulavel localmente).
  OLLAMA_VERSION: v0.9.0

jobs:
  # ==========================================================================
  # Windows — .exe (bootstrapper WiX Burn, uso comum) E .msi (instalacao
  # silenciosa/TI), os dois gerados a partir da mesma app-image (compativel
  # com Windows 10 e superior; jpackage/WiX nao empacotam nada especifico de
  # versao do Windows, mas o instalador so foi validado a partir do Windows
  # 10 — versoes anteriores nao sao suportadas).
  # ==========================================================================
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # JDK 25 (nao mais 17): o launcher .exe que o jpackage gera pro Windows
      # se REINICIA sozinho num segundo processo logo ao abrir, so pra poder
      # ajustar a variavel PATH antes de carregar a JVM (limitacao do
      # jli.dll, nao da pra mudar PATH do processo atual) — e enquanto espera
      # esse segundo processo, roda um loop de mensagens do Windows
      # (GetMessage()) que pode falhar (ex.: antivirus/EDR interferindo na
      # criacao do processo suspenso) com exatamente o erro relatado pelo
      # usuario: "GetMessage() failed", System error 1400 (janela invalida).
      # A partir do JDK 24 (JDK-8340311) o jpackage passou a ler uma
      # propriedade "win.norestart=true" no .cfg da app pra PULAR esse
      # reinicio de vez — usada logo abaixo, na geracao do instalador (ver
      # "Desativar o reinicio do launcher"). JDK 17 nao le essa propriedade
      # (silenciosamente ignorada), entao o reinicio arriscado ficava sempre
      # ligado sem nenhum jeito de desliga-lo.
      - name: Configurar JDK 25 (inclui o jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derivar a versao a partir da tag (remove o 'v')
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sincronizar o pom.xml com a versao da tag
        # Sem isto, o jar empacotado abaixo carrega a versao "solta" do
        # pom.xml (ex.: 0.4.4-SNAPSHOT), desincronizada da tag publicada —
        # e o sistema de atualizacao automatica (com.nureal.ide.core.update.AppVersion,
        # que le Implementation-Version do manifesto do jar) compararia a
        # versao ERRADA. Este passo faz a tag do Git ser a fonte unica de
        # verdade: tag -> pom.xml -> manifesto do jar -> --app-version do
        # jpackage, tudo com o MESMO numero.
        run: mvn -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Compilar e gerar o fat JAR
        run: mvn -B -DskipTests package

      - name: Instalar o WiX Toolset (jpackage usa para gerar o .exe e o .msi)
        run: choco install wixtoolset --no-progress -y

      - name: Preparar pasta de entrada do jpackage (apenas o fat jar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/dist | Out-Null
          Copy-Item target/nureal-database-ide.jar target/dist/

      - name: Baixar o Ollama embutido (Windows amd64)
        # Fica em target/dist/ollama-bin/ollama.exe -- dentro do MESMO --input
        # do jpackage, entao acaba embutido no app-image final em
        # <raiz do app-image>/app/ollama-bin/ollama.exe (ver
        # core.ai.runtime.OllamaBinaryLocator, que resolve exatamente este
        # caminho em runtime via "jpackage.app-path").
        shell: pwsh
        run: |
          $dest = "target/dist/ollama-bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zipUrl = "https://github.com/ollama/ollama/releases/download/$env:OLLAMA_VERSION/ollama-windows-amd64.zip"
          curl.exe -L -o target/ollama.zip $zipUrl
          Expand-Archive -Path target/ollama.zip -DestinationPath $dest -Force
          if (-not (Test-Path "$dest/ollama.exe")) {
            throw "ollama.exe nao encontrado apos extrair $zipUrl -- o nome/formato do asset do Ollama pode ter mudado (ver OLLAMA_VERSION no topo do workflow)"
          }

      - name: Gerar a imagem da aplicacao (app-image)
        # Passo 1 de 4 do instalador (era so 1 passo antes): gera a "app
        # image" (a pasta com o .exe launcher + a JVM embutida + o jar) SEM
        # empacotar em instalador nenhum ainda — precisamos dela solta pra
        # poder editar o .cfg no proximo passo (ver "Desativar o reinicio do
        # launcher") antes de gerar os instaladores de fato (.exe e .msi,
        # ambos a partir desta MESMA app-image).
        shell: pwsh
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          jpackage `
            --type app-image `
            --name "Nureal Database IDE" `
            --app-version "${{ steps.ver.outputs.version }}" `
            --input target/dist `
            --main-jar nureal-database-ide.jar `
            --main-class com.nureal.ide.App `
            --icon src/main/resources/com/nureal/ide/icon/nureal.ico `
            --dest target/appimage `
            --vendor "Nureal"

      - name: Desativar o reinicio do launcher (win.norestart=true)
        # Passo 2 de 4: injeta "win.norestart=true" na secao [Application] do
        # .cfg que o jpackage acabou de gerar dentro da app-image — property
        # que o launcher .exe (JDK 24+, ver comentario no passo de
        # "Configurar JDK") le pra NUNCA reiniciar a si mesmo, eliminando de
        # vez o caminho de codigo (loop de GetMessage()) que causava o erro
        # "GetMessage() failed / System error 1400" relatado pelo usuario. O
        # jpackage nao tem uma flag de linha de comando pra isto — so da pra
        # aplicar editando o .cfg gerado, por isso o build vira 4 passos em
        # vez de 1 (gerar app-image -> editar .cfg -> empacotar .exe ->
        # empacotar .msi, os dois ultimos a partir da mesma app-image ja
        # editada).
        shell: pwsh
        run: |
          $cfgPath = "target/appimage/Nureal Database IDE/app/Nureal Database IDE.cfg"
          if (-not (Test-Path $cfgPath)) {
            throw "Nao encontrei o .cfg da app-image em: $cfgPath"
          }
          $lines = Get-Content -Path $cfgPath
          $out = New-Object System.Collections.Generic.List[string]
          $found = $false
          foreach ($line in $lines) {
            $out.Add($line)
            if ($line.Trim() -eq '[Application]') {
              $out.Add('win.norestart=true')
              $found = $true
            }
          }
          if (-not $found) {
            throw "Secao [Application] nao encontrada em: $cfgPath (formato do .cfg pode ter mudado)"
          }
          Set-Content -Path $cfgPath -Value $out
          Write-Host "win.norestart=true injetado em $cfgPath"

      - name: Gerar o instalador Windows (.exe) a partir da app-image
        # Passo 3 de 4: empacota a app-image (ja com o .cfg editado) num
        # .exe (bootstrapper WiX Burn, que embute um .msi por baixo) — usa
        # --app-image em vez de --input/--main-jar/--main-class (esses sao
        # so pra CRIAR uma app-image do zero, ver passo 1; aqui so estamos
        # empacotando a que ja existe). --win-upgrade-uuid fixo garante que
        # o Windows reconheca instalacoes de versoes anteriores (upgrade em
        # vez de instalacao lado a lado a cada release). Publicamos os DOIS
        # formatos (.exe aqui, .msi no passo seguinte) a partir da MESMA
        # app-image (ja com win.norestart=true) — .exe pro uso comum
        # (duplo-clique, o auto-update embutido na IDE baixa e roda este),
        # .msi pra instalacao silenciosa/TI (Group Policy, SCCM, msiexec
        # /quiet). Mesmo --win-upgrade-uuid nos dois pra qualquer um dos
        # dois reconhecer uma instalacao anterior feita pelo outro como
        # upgrade, em vez de instalacao lado a lado.
        shell: pwsh
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          jpackage `
            --type exe `
            --name "Nureal Database IDE" `
            --app-version "${{ steps.ver.outputs.version }}" `
            --app-image "target/appimage/Nureal Database IDE" `
            --dest target/installer `
            --vendor "Nureal" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-upgrade-uuid "8f14e1c2-6b3a-4b1e-9c2d-1a2b3c4d5e6f"

      - name: Gerar o instalador Windows (.msi) a partir da app-image
        # Passo 4 de 4: mesma app-image, mesmo --win-upgrade-uuid, so troca
        # --type pra msi — ver comentario do passo anterior.
        shell: pwsh
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          jpackage `
            --type msi `
            --name "Nureal Database IDE" `
            --app-version "${{ steps.ver.outputs.version }}" `
            --app-image "target/appimage/Nureal Database IDE" `
            --dest target/installer `
            --vendor "Nureal" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-upgrade-uuid "8f14e1c2-6b3a-4b1e-9c2d-1a2b3c4d5e6f"

      - name: Publicar artefatos (Windows)
        # Apenas os instaladores (.exe/.msi) — o fat jar (target/nureal-database-ide.jar)
        # NAO entra aqui de proposito: e um arquivo .jar (formato zip por baixo),
        # nao um executavel, e nao deve aparecer nos Assets do Release (ver
        # job "publish-release" abaixo, que so publica extensoes de instalador).
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/installer/*.exe
            target/installer/*.msi
          retention-days: 1

  # ==========================================================================
  # macOS — .dmg, um build por arquitetura (Apple Silicon/arm64 e Intel/x64).
  # macos-14 roda em runners Apple Silicon nativos; macos-15-intel roda em
  # runners Intel — nao ha cross-compilation aqui, cada job gera o binario
  # nativo da sua propria arquitetura (jpackage embute uma JVM da MESMA
  # arquitetura do runner que o executou).
  #
  # IMPORTANTE — "macos-13" (usado antes aqui) foi DESATIVADO pela GitHub em
  # 4/dez/2025: um job com "runs-on: macos-13" fica preso pra sempre
  # "Waiting for a runner to pick up this job" (nunca falha, nunca roda —
  # so fica carregando), porque esse runner label simplesmente nao existe
  # mais. "macos-15-intel" e o label atual pra Intel (disponivel ate
  # ago/2027 — depois disso a GitHub para de oferecer runner x86_64 pra
  # macOS de vez, so arm64/Apple Silicon).
  #
  # IMPORTANTE — assinatura/notarizacao: este workflow gera um .dmg NAO
  # assinado (nao ha um Apple Developer ID configurado neste repositorio).
  # O macOS (Gatekeeper) vai bloquear a abertura direta ("app esta
  # danificado" / "desenvolvedor nao identificado") ate o usuario liberar
  # manualmente (clique direito -> Abrir, ou "xattr -cr" no .app depois de
  # extrair o .dmg). Para distribuir sem esse aviso, o proximo passo seria
  # assinar e notarizar com uma conta Apple Developer Program (paga).
  # ==========================================================================
  macos-installer:
    runs-on: ${{ matrix.runner }}
    strategy:
      # fail-fast: false -- sem isto, se o job arm64 falhar o job x64 (Intel)
      # e cancelado no meio (foi o que aconteceu antes: "macos-installer
      # (macos-13, x64, Intel)" foi cancelado so porque o arm64 falhou),
      # escondendo se o build Intel teria funcionado. Cada arquitetura roda
      # ate o fim, independente do resultado da outra.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: "Apple Silicon"
          - runner: macos-15-intel
            arch: x64
            label: "Intel"
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 25 (inclui o jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derivar a versao a partir da tag (remove o 'v') e gerar uma variante compativel com o macOS
        id: ver
        shell: bash
        # "version" e a versao real do projeto (ex.: 0.6.9), usada no pom.xml,
        # no manifesto do jar e no nome do arquivo .dmg.
        # "macversion" existe SO por causa de uma exigencia do jpackage no
        # macOS: --app-version vira o CFBundleVersion do Info.plist, e o
        # macOS EXIGE que o primeiro numero seja >= 1 ("The first number in
        # an app-version cannot be zero or negative" -- erro visto no job
        # macos-installer). Como o projeto ainda esta na faixa 0.x.y, somamos
        # 1 ao numero major SO para este valor, e SO usamos macversion no
        # passo "Gerar o instalador macOS (.dmg)" abaixo -- em todo o resto
        # (pom.xml, manifesto, nome do arquivo) continua a versao real. Efeito
        # colateral aceitavel: no Finder (Get Info / Sobre) o app vai mostrar
        # "1.6.9" em vez de "0.6.9"; o instalador e o nome do arquivo mostram
        # a versao real normalmente.
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          major="${version%%.*}"
          rest="${version#*.}"
          echo "macversion=$((major + 1)).$rest" >> "$GITHUB_OUTPUT"

      - name: Sincronizar o pom.xml com a versao da tag
        run: mvn -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Compilar e gerar o fat JAR
        run: mvn -B -DskipTests package

      - name: Preparar pasta de entrada do jpackage (apenas o fat jar)
        run: |
          mkdir -p target/dist
          cp target/nureal-database-ide.jar target/dist/

      - name: Baixar o Ollama embutido (macOS, binario universal arm64+x64)
        # O Ollama publica um UNICO binario "universal" (lipo) pro macOS --
        # mesmo asset serve os dois legs da matrix (arm64/Apple Silicon e
        # x64/Intel), sem logica por arquitetura aqui. Fica em
        # target/dist/ollama-bin/ollama, dentro do --input do jpackage (o
        # macOS nao tem um passo de app-image separado -- vai direto pro
        # --type dmg abaixo), entao acaba embutido em
        # Contents/app/ollama-bin/ollama no .app final (ver
        # core.ai.runtime.OllamaBinaryLocator).
        run: |
          mkdir -p target/dist/ollama-bin
          curl -L -o target/ollama.tgz "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-darwin.tgz"
          tar -xzf target/ollama.tgz -C target/dist/ollama-bin
          if [ ! -f target/dist/ollama-bin/ollama ]; then
            echo "ollama nao encontrado apos extrair ollama-darwin.tgz -- o nome/formato do asset do Ollama pode ter mudado (ver OLLAMA_VERSION no topo do workflow)" >&2
            exit 1
          fi
          chmod +x target/dist/ollama-bin/ollama

      - name: Gerar o icone .icns a partir do PNG existente
        # O projeto so tem .ico (Windows) e .svg/.png (UI) — o macOS exige
        # .icns. Gerado em build-time com as ferramentas que ja vem no
        # runner (sips/iconutil), a partir do maior PNG disponivel
        # (nureal-256.png). Fonte com 256x256: os tamanhos @2x acima de 256
        # ficam com upscale (qualidade menor que um .icns feito a mao a
        # partir de um PNG maior, mas funcional).
        run: |
          ICONSET=target/nureal.iconset
          mkdir -p "$ICONSET"
          SRC=src/main/resources/com/nureal/ide/icon/nureal-256.png
          sips -z 16 16   "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32   "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32   "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64   "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_256x256.png"
          cp "$SRC" "$ICONSET/icon_256x256@2x.png"
          cp "$SRC" "$ICONSET/icon_512x512.png"
          cp "$SRC" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o target/nureal.icns

      - name: Gerar o instalador macOS (.dmg)
        # --app-version usa "macversion" (nao "version"), ver comentario no
        # passo "Derivar a versao" acima -- macOS rejeita --app-version que
        # comece com 0.
        run: |
          jpackage \
            --type dmg \
            --name "Nureal Database IDE" \
            --app-version "${{ steps.ver.outputs.macversion }}" \
            --input target/dist \
            --main-jar nureal-database-ide.jar \
            --main-class com.nureal.ide.App \
            --icon target/nureal.icns \
            --dest target/installer \
            --vendor "Nureal" \
            --mac-package-identifier com.nureal.databaseide \
            --mac-package-name "Nureal IDE"

      - name: Renomear o .dmg incluindo a arquitetura
        # jpackage gera sempre "Nureal Database IDE-<versao>.dmg", sem
        # distinguir arquitetura — sem renomear, o job Apple Silicon e o job
        # Intel gerariam o MESMO nome de arquivo, e o upload do segundo
        # sobrescreveria o do primeiro no Release.
        run: |
          cd target/installer
          for f in *.dmg; do
            mv "$f" "Nureal Database IDE-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.dmg"
          done
          ls -la

      - name: Publicar artefatos (macOS ${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: target/installer/*.dmg
          retention-days: 1

  # ==========================================================================
  # Linux — .deb (Debian/Ubuntu) e .AppImage (portavel, roda em qualquer
  # distro sem instalar nada). Um unico job gera os dois a partir da mesma
  # app-image, igual ao Windows (app-image -> empacota em cada formato).
  # ==========================================================================
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 25 (inclui o jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derivar a versao a partir da tag (remove o 'v')
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sincronizar o pom.xml com a versao da tag
        run: mvn -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Compilar e gerar o fat JAR
        run: mvn -B -DskipTests package

      - name: Preparar pasta de entrada do jpackage (apenas o fat jar)
        run: |
          mkdir -p target/dist
          cp target/nureal-database-ide.jar target/dist/

      - name: Baixar o Ollama embutido (Linux amd64)
        # Fica em target/dist/ollama-bin/ollama, dentro do --input do
        # jpackage, entao acaba embutido no app-image final em
        # <raiz do app-image>/app/ollama-bin/ollama (ver
        # core.ai.runtime.OllamaBinaryLocator). O .tgz do Linux tradicionalmente
        # traz o binario dentro de bin/ (as vezes junto de lib/ com
        # dependencias) -- normaliza pra ollama-bin/ollama ficar direto na
        # raiz esperada pelo locator, mantendo qualquer lib/ associada ao lado.
        run: |
          mkdir -p target/dist/ollama-bin
          curl -L -o target/ollama.tgz "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tgz"
          tar -xzf target/ollama.tgz -C target/dist/ollama-bin
          if [ -f target/dist/ollama-bin/bin/ollama ] && [ ! -f target/dist/ollama-bin/ollama ]; then
            mv target/dist/ollama-bin/bin/ollama target/dist/ollama-bin/ollama
          fi
          if [ ! -f target/dist/ollama-bin/ollama ]; then
            echo "ollama nao encontrado apos extrair ollama-linux-amd64.tgz -- o nome/formato do asset do Ollama pode ter mudado (ver OLLAMA_VERSION no topo do workflow)" >&2
            exit 1
          fi
          chmod +x target/dist/ollama-bin/ollama

      - name: Gerar a imagem da aplicacao (app-image)
        # Mesma base para os dois formatos abaixo (.deb e .AppImage) — evita
        # compilar a app-image duas vezes.
        run: |
          jpackage \
            --type app-image \
            --name "Nureal Database IDE" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --input target/dist \
            --main-jar nureal-database-ide.jar \
            --main-class com.nureal.ide.App \
            --icon src/main/resources/com/nureal/ide/icon/nureal-256.png \
            --dest target/appimage \
            --vendor "Nureal"

      - name: Gerar o instalador .deb a partir da app-image
        # A flag e "--linux-deb-maintainer" (nao "--maintainer", que nao
        # existe no jpackage e derrubava o job com "Invalid Option:
        # [--maintainer]").
        run: |
          mkdir -p target/installer
          jpackage \
            --type deb \
            --name "Nureal Database IDE" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --app-image "target/appimage/Nureal Database IDE" \
            --dest target/installer \
            --vendor "Nureal" \
            --linux-shortcut \
            --linux-menu-group "Development" \
            --linux-app-category "database" \
            --description "IDE para desenvolvedores de banco de dados" \
            --linux-deb-maintainer "alves.cvinicius@gmail.com"

      - name: Montar o AppDir para o .AppImage
        # appimagetool exige uma pasta no formato "AppDir": AppRun (o
        # executavel a rodar), um .desktop na raiz e um icone na raiz com o
        # MESMO nome referenciado em "Icon=" do .desktop. Reaproveita a
        # mesma app-image gerada acima, so adicionando esses 3 itens por
        # cima — sem rebuildar nada.
        run: |
          APPDIR="target/AppDir"
          rm -rf "$APPDIR"
          cp -r "target/appimage/Nureal Database IDE" "$APPDIR"
          ln -sf "bin/Nureal Database IDE" "$APPDIR/AppRun"
          cp src/main/resources/com/nureal/ide/icon/nureal-256.png "$APPDIR/nureal.png"
          cat > "$APPDIR/nureal-database-ide.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Nureal Database IDE
          Exec=AppRun
          Icon=nureal
          Categories=Development;Database;
          Terminal=false
          EOF

      - name: Baixar o appimagetool
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Gerar o .AppImage
        # --appimage-extract-and-run: appimagetool e ele mesmo um AppImage,
        # que normalmente precisa de FUSE para rodar — nem sempre disponivel
        # no runner. Esta flag extrai e roda sem depender de FUSE.
        run: |
          ./appimagetool --appimage-extract-and-run target/AppDir \
            "target/installer/Nureal Database IDE-${{ steps.ver.outputs.version }}-x86_64.AppImage"

      - name: Publicar artefatos (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            target/installer/*.deb
            target/installer/*.AppImage
          retention-days: 1

  # ==========================================================================
  # Junta os artefatos dos 3 jobs acima e publica TUDO num unico GitHub
  # Release (mesma tag) — um job separado, que so roda depois que Windows,
  # macOS (as 2 arquiteturas) e Linux terminarem com sucesso.
  # ==========================================================================
  publish-release:
    needs: [windows-installer, macos-installer, linux-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos dos jobs anteriores
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Nureal Database IDE ${{ github.ref_name }}
          body: |
            Instaladores desta versao:

            - **Windows 10 ou superior**: `.exe` (recomendado, uso comum) ou `.msi`
              (instalacao silenciosa/TI — Group Policy, SCCM, `msiexec /quiet`)
            - **macOS (Apple Silicon)**: `.dmg` (arquivo `-arm64.dmg`)
            - **macOS (Intel)**: `.dmg` (arquivo `-x64.dmg`)
            - **Linux**: `.deb` (Debian/Ubuntu) ou `.AppImage` (qualquer distro, sem instalar)

            > Chat com IA: o Ollama vem embutido no instalador (por isso ele ficou maior —
            > mais ~100-300MB) — nao e preciso instalar nada separado. No primeiro uso do
            > chat a IDE baixa sozinha um modelo padrao (poucos GB, precisa de internet
            > nesse momento; depois funciona 100% offline). Quem preferir apontar pra um
            > Ollama proprio (outra maquina, GPU dedicada etc.) pode desligar o modo
            > embutido nas configuracoes de IA.

            > Windows: nem o `.exe` nem o `.msi` sao assinados (sem certificado de
            > assinatura de codigo configurado neste repositorio) — o SmartScreen
            > pode avisar "O Windows protegeu o computador". Clique em "Mais
            > informacoes" -> "Executar assim mesmo" para instalar.
            > macOS: o `.dmg` nao e assinado/notarizado. Se o Gatekeeper bloquear a
            > abertura ("app esta danificado" ou "desenvolvedor nao identificado"),
            > clique com o botao direito no app -> Abrir, ou rode
            > `xattr -cr "Nureal Database IDE.app"` no Terminal apos copiar o app
            > para Aplicativos.
          files: |
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.msi
            artifacts/macos-installer-arm64/*.dmg
            artifacts/macos-installer-x64/*.dmg
            artifacts/linux-installer/*.deb
            artifacts/linux-installer/*.AppImage
