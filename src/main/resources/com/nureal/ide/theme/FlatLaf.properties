# Tema Nureal (aplica-se aos temas claro e escuro do FlatLaf)
# Visual moderno: acento esmeralda, cantos padronizados (~6-8px) e realces suaves.
# Tons de cinza suaves (sem branco puro) para cansar menos a vista.

@accentColor = #059669

# Cantos arredondados padronizados (estilo Tailwind/shadcn ~6-8px)
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
ProgressBar.arc = 8
Popup.borderCornerRadius = 8

# Foco discreto com o esmeralda da marca
Component.focusWidth = 1
Component.innerFocusWidth = 1
Component.focusColor = #05966966

# Barras de rolagem finas e arredondadas
ScrollBar.width = 11
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.showButtons = false

# Divisorias finas entre os paineis (menos "grossas")
SplitPane.dividerSize = 4

# Abas estilo "card" mais limpas (mesmo estilo no editor e nos resultados)
TabbedPane.tabType = card
TabbedPane.showTabSeparators = false
TabbedPane.tabArc = 8
TabbedPane.tabInsets = 6,14,6,14

# Janela com fundo unificado
TitlePane.unifiedBackground = true

# ---------------- Tema claro: cinzas suaves ----------------
# "Moldura" (janela, paineis, abas, rolagem) num cinza um pouco mais fechado
[light]@background = #E9EBEF
[light]Panel.background = #E9EBEF
[light]TabbedPane.background = #E9EBEF
[light]ScrollPane.background = #E9EBEF
[light]MenuBar.background = #E9EBEF
[light]ToolBar.background = #E9EBEF
[light]SplitPane.background = #E9EBEF

# Superficies de conteudo num cinza bem claro (nao branco puro)
[light]TextField.background = #F6F7F9
[light]FormattedTextField.background = #F6F7F9
[light]PasswordField.background = #F6F7F9
[light]ComboBox.background = #F6F7F9
[light]Spinner.background = #F6F7F9
[light]List.background = #F4F5F8
[light]Tree.background = #F4F5F8
[light]Table.background = #F6F7F9
[light]TextArea.background = #F6F7F9
[light]TextPane.background = #F6F7F9
[light]EditorPane.background = #F6F7F9
[light]Viewport.background = #F6F7F9

[light]TextComponent.selectionBackground = #05966933

# Selecao NEUTRA (cinza-azulado), nao mais o verde solido da marca — usar a
# cor de acao/marca como fundo de selecao "grita" demais quando cobre uma
# linha/celula/item de menu inteiro (relatado pelo usuario: "esse verde como
# background... e enjoativo e nao combina"). O verde continua reservado para
# acoes/destaques pontuais (botao primario, dot de status, icones positivos),
# nunca mais como um bloco solido de fundo. Mesmo tom usado por
# GridTheme.SELECTION_BACKGROUND (grade de resultados) — um so lugar decide
# "qual e a cor de selecao do app".
[light]List.selectionBackground = #CFD8DC
[light]Tree.selectionBackground = #CFD8DC
[light]Table.selectionBackground = #CFD8DC
[light]Menu.selectionBackground = #CFD8DC
[light]MenuItem.selectionBackground = #CFD8DC
[light]CheckBoxMenuItem.selectionBackground = #CFD8DC
[light]RadioButtonMenuItem.selectionBackground = #CFD8DC
[light]MenuBar.selectionBackground = #CFD8DC
[light]List.selectionForeground = #263238
[light]Tree.selectionForeground = #263238
[light]Table.selectionForeground = #263238
[light]Menu.selectionForeground = #263238
[light]MenuItem.selectionForeground = #263238
[light]CheckBoxMenuItem.selectionForeground = #263238
[light]RadioButtonMenuItem.selectionForeground = #263238

# ---------------- Tema escuro ----------------
[dark]TextComponent.selectionBackground = #05966955
[dark]List.selectionBackground = #3E4A52
[dark]Tree.selectionBackground = #3E4A52
[dark]Table.selectionBackground = #3E4A52
[dark]Menu.selectionBackground = #3E4A52
[dark]MenuItem.selectionBackground = #3E4A52
[dark]CheckBoxMenuItem.selectionBackground = #3E4A52
[dark]RadioButtonMenuItem.selectionBackground = #3E4A52
[dark]MenuBar.selectionBackground = #3E4A52
[dark]List.selectionForeground = #ECEFF1
[dark]Tree.selectionForeground = #ECEFF1
[dark]Table.selectionForeground = #ECEFF1
[dark]Menu.selectionForeground = #ECEFF1
[dark]MenuItem.selectionForeground = #ECEFF1
[dark]CheckBoxMenuItem.selectionForeground = #ECEFF1
[dark]RadioButtonMenuItem.selectionForeground = #ECEFF1
