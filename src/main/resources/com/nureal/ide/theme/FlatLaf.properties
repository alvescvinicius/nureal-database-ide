# Tema Nureal (aplica-se aos temas claro e escuro do FlatLaf)
# Redesenho "novo e leve" pedido pelo usuario (Fase 6): menos camadas de
# cinza (moldura/superficie/lista quase achatadas num so nivel), bordas
# quase invisiveis, abas planas com indicador fino em vez de "pilula"
# preenchida, cantos um pouco mais discretos. Acento verde institucional
# Nureal reservado para botao primario/indicadores/icones ativos, nunca mais
# como fundo de selecao/aba (regra ja em vigor desde a rodada anterior,
# mantida aqui).

# Verde institucional da marca (ver DESIGN_SYSTEM.md, secao 2) — era #059669
# (esmeralda generico); atualizado junto com MainWindow.ACCENT (mesmo valor,
# dois pontos de verdade diferentes porque o Java le MainWindow.ACCENT e o
# FlatLaf le este arquivo — nao ha como um so cobrir os dois).
@accentColor = #1E9147

# Cantos mais discretos (era 8px): menos "peso" visual em botoes/campos/popups.
Component.arc = 6
Button.arc = 6
TextComponent.arc = 6
ProgressBar.arc = 6
Popup.borderCornerRadius = 6

# Foco discreto com o verde da marca
Component.focusWidth = 1
Component.innerFocusWidth = 1
Component.focusColor = #1E914766

# Barras de rolagem finas e arredondadas
ScrollBar.width = 11
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.showButtons = false

# Divisorias finas entre os paineis (menos "grossas")
SplitPane.dividerSize = 4

# Abas PLANAS com indicador fino embaixo da aba ativa (era "card": fundo
# preenchido na aba selecionada) — pedido explicito do usuario ("algo novo,
# leve"): menos uma camada de contraste solido na tela, a aba ativa se
# destingue por um traco de 2px na cor de acento, nao por um bloco de cor.
# Mesmo estilo nas abas de conexao/terminal/resultado.
TabbedPane.tabType = underlined
TabbedPane.showTabSeparators = false
TabbedPane.tabArc = 6
TabbedPane.tabInsets = 6,14,6,14
TabbedPane.underlineColor = #1E9147
TabbedPane.tabSelectionHeight = 2

# Janela com fundo unificado
TitlePane.unifiedBackground = true

# ---------------- Tema claro: quase monocromatico ----------------
# Moldura (janela, paineis, abas, rolagem) num cinza muito claro, quase
# branco — era #E9EBEF (perceptivelmente mais escuro que o conteudo,
# criando uma "borda" visual grande em volta de cada painel).
[light]@background = #F7F8F9
[light]Panel.background = #F7F8F9
[light]TabbedPane.background = #F7F8F9
[light]ScrollPane.background = #F7F8F9
[light]MenuBar.background = #F7F8F9
[light]ToolBar.background = #F7F8F9
[light]SplitPane.background = #F7F8F9

# Superficies de conteudo BEM proximas da moldura agora (era um degrade de
# 3 cinzas — moldura/campo/lista — cada um com sua propria borda visual;
# achatado pra 1 nivel so, a diferenca entre painel e conteudo vem do
# espacamento, nao mais de bordas/tons de cinza empilhados).
[light]TextField.background = #FFFFFF
[light]FormattedTextField.background = #FFFFFF
[light]PasswordField.background = #FFFFFF
[light]ComboBox.background = #FFFFFF
[light]Spinner.background = #FFFFFF
[light]List.background = #FFFFFF
[light]Tree.background = #FFFFFF
[light]Table.background = #FFFFFF
[light]TextArea.background = #FFFFFF
[light]TextPane.background = #FFFFFF
[light]EditorPane.background = #FFFFFF
[light]Viewport.background = #FFFFFF

# Bordas quase invisiveis (eram #E0E3E7/padrao do FlatLaf, visiveis demais
# contra o novo fundo quase branco) — separam por contraste minimo, nao por
# traco forte.
[light]Component.borderColor = #EBEDEF
[light]Component.disabledBorderColor = #EBEDEF
[light]TabbedPane.contentAreaColor = #F7F8F9
[light]Table.gridColor = #F0F1F3
[light]Separator.foreground = #EBEDEF

[light]TextComponent.selectionBackground = #1E914733

# Selecao NEUTRA (cinza-azulado), nao mais o verde solido da marca — usar a
# cor de acao/marca como fundo de selecao "grita" demais quando cobre uma
# linha/celula/item de menu inteiro (relatado pelo usuario: "esse verde como
# background... e enjoativo e nao combina"). O verde continua reservado para
# acoes/destaques pontuais (botao primario, dot de status, icones positivos),
# nunca mais como um bloco solido de fundo. Mesmo tom usado por
# GridTheme.SELECTION_BACKGROUND (grade de resultados) — um so lugar decide
# "qual e a cor de selecao do app".
[light]List.selectionBackground = #CFD8DC
[light]Tree.selectionBackground = #CFD8DC
[light]Table.selectionBackground = #CFD8DC
[light]Menu.selectionBackground = #CFD8DC
[light]MenuItem.selectionBackground = #CFD8DC
[light]CheckBoxMenuItem.selectionBackground = #CFD8DC
[light]RadioButtonMenuItem.selectionBackground = #CFD8DC
[light]MenuBar.selectionBackground = #CFD8DC
[light]List.selectionForeground = #263238
[light]Tree.selectionForeground = #263238
[light]Table.selectionForeground = #263238
[light]Menu.selectionForeground = #263238
[light]MenuItem.selectionForeground = #263238
[light]CheckBoxMenuItem.selectionForeground = #263238
[light]RadioButtonMenuItem.selectionForeground = #263238

# ---------------- Tema escuro ----------------
[dark]TextComponent.selectionBackground = #1E914755
[dark]List.selectionBackground = #3E4A52
[dark]Tree.selectionBackground = #3E4A52
[dark]Table.selectionBackground = #3E4A52
[dark]Menu.selectionBackground = #3E4A52
[dark]MenuItem.selectionBackground = #3E4A52
[dark]CheckBoxMenuItem.selectionBackground = #3E4A52
[dark]RadioButtonMenuItem.selectionBackground = #3E4A52
[dark]MenuBar.selectionBackground = #3E4A52
[dark]List.selectionForeground = #ECEFF1
[dark]Tree.selectionForeground = #ECEFF1
[dark]Table.selectionForeground = #ECEFF1
[dark]Menu.selectionForeground = #ECEFF1
[dark]MenuItem.selectionForeground = #ECEFF1
[dark]CheckBoxMenuItem.selectionForeground = #ECEFF1
[dark]RadioButtonMenuItem.selectionForeground = #ECEFF1
